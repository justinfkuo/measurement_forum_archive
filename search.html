<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - Measurement Forum Archive</title>
  <style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-alt: #f1f5f9;
  --text: #0f172a;
  --text-muted: #475569;
  --border: #e2e8f0;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --badge-bg: #eff6ff;
  --badge-text: #1e40af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1120;
    --surface: #111827;
    --surface-alt: #1e293b;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #1e293b;
    --accent: #60a5fa;
    --accent-hover: #93c5fd;
    --badge-bg: #1e3a8a;
    --badge-text: #dbeafe;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.5rem;
  position: sticky;
  top: 0;
  z-index: 10;
}
.topbar-inner {
  max-width: 1040px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  align-items: center;
  justify-content: space-between;
}
.brand h1 { margin: 0; font-size: 1.25rem; }
.brand p { margin: 0.15rem 0 0; font-size: 0.85rem; color: var(--text-muted); }
.search-form { display: flex; gap: 0.5rem; }
.search-form input {
  padding: 0.5rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  min-width: 230px;
}
.search-form button {
  padding: 0.5rem 0.9rem;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: #ffffff;
  font-weight: 600;
  cursor: pointer;
}
.container { max-width: 1040px; margin: 1.5rem auto; padding: 0 1.25rem 3rem; }
.breadcrumbs { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; }
.banner {
  background: var(--badge-bg);
  color: var(--badge-text);
  padding: 0.65rem 1rem;
  border-radius: 10px;
  font-size: 0.88rem;
  margin-bottom: 1.25rem;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.15rem 1.35rem;
  margin-bottom: 0.9rem;
}
.card-title { font-size: 1.1rem; font-weight: 600; margin: 0 0 0.3rem; }
.meta { font-size: 0.85rem; color: var(--text-muted); }
.post-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 1.1rem;
  overflow: hidden;
}
.post-header {
  background: var(--surface-alt);
  padding: 0.65rem 1.25rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  font-size: 0.88rem;
}
.post-author { font-weight: 700; }
.post-body { padding: 1.25rem; overflow-wrap: break-word; }
.post-body img { max-width: 100%; height: auto; }
.attachments {
  margin-top: 1rem;
  padding-top: 0.75rem;
  border-top: 1px dashed var(--border);
  font-size: 0.88rem;
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1><a href="index.html" style="color: inherit;">Measurement Forum Archive</a></h1>
        <p>Read-only historical archive of measure.infopop.cc</p>
      </div>
      <form class="search-form" action="search.html" method="get">
        <input type="search" name="q" placeholder="Search threads & posts..." aria-label="Search archive">
        <button type="submit">Search</button>
      </form>
    </div>
  </header>
  <main class="container">
    <div class="banner">Read-Only Historical Archive &mdash; Posting and registration are permanently closed.</div>
    <nav class="breadcrumbs"><a href="index.html">Home</a> &rsaquo; Search</nav>
    
        <h2>Search Forum Archive</h2>
        <div class="card">
          <input type="search" id="liveSearchInput" placeholder="Type keywords, usernames, or topics..."
                 style="width:100%; padding:0.7rem; font-size:1rem; border:1px solid var(--border); border-radius:8px; background:var(--bg); color:var(--text);">
          <p class="meta" id="searchStatus" style="margin:0.5rem 0 0;">Enter a search term above.</p>
        </div>
        <div id="searchResults"></div>
        
  </main>
  
        <script src="search_index.js"></script>
        <script>
          (function() {
            const input = document.getElementById('liveSearchInput');
            const status = document.getElementById('searchStatus');
            const resultsEl = document.getElementById('searchResults');
            const records = window.FORUM_SEARCH_INDEX || [];

            function escapeHtml(str) {
              return String(str).replace(/[&<>"']/g, s => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
              }[s]));
            }

            function runSearch(query) {
              const q = query.trim().toLowerCase();
              if (!q) {
                status.textContent = 'Showing ' + records.length.toLocaleString() + ' indexed posts. Enter a keyword above.';
                resultsEl.innerHTML = '';
                return;
              }
              const terms = q.split(/\s+/);
              const matches = records.filter(item => {
                const hay = (item.title + ' ' + item.author + ' ' + item.area + ' ' + item.text).toLowerCase();
                return terms.every(t => hay.includes(t));
              });
              status.textContent = 'Found ' + matches.length.toLocaleString() + ' matching post(s) for "' + query + '".';
              resultsEl.innerHTML = matches.slice(0, 100).map(m => `
                <div class="card">
                  <div class="card-title"><a href="${escapeHtml(m.url)}">${escapeHtml(m.title)}</a></div>
                  <div class="meta">${escapeHtml(m.area)} &bull; Posted by <strong>${escapeHtml(m.author)}</strong> on ${escapeHtml(m.date)}</div>
                  <p style="margin:0.5rem 0 0; font-size:0.93rem;">${escapeHtml(m.text.slice(0, 260))}${m.text.length > 260 ? '...' : ''}</p>
                </div>
              `).join('');
            }

            const params = new URLSearchParams(window.location.search);
            const initialQ = params.get('q') || '';
            input.value = initialQ;
            runSearch(initialQ);
            input.addEventListener('input', () => runSearch(input.value));
          })();
        </script>
        
</body>
</html>
