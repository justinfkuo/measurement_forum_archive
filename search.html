<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - Measurement Forum Archive</title>
  <style>
:root {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-alt: #f1f5f9;
  --text: #0f172a;
  --text-muted: #475569;
  --border: #e2e8f0;
  --accent: #2563eb;
  --accent-hover: #1d4ed8;
  --badge-bg: #eff6ff;
  --badge-text: #1e40af;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b1120;
    --surface: #111827;
    --surface-alt: #1e293b;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #1e293b;
    --accent: #60a5fa;
    --accent-hover: #93c5fd;
    --badge-bg: #1e3a8a;
    --badge-text: #dbeafe;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.5rem;
  position: sticky;
  top: 0;
  z-index: 10;
}
.topbar-inner {
  max-width: 1040px;
  margin: 0 auto;
  display: flex;
  flex-wrap: wrap;
  gap: 1rem;
  align-items: center;
  justify-content: space-between;
}
.brand h1 { margin: 0; font-size: 1.25rem; }
.brand p { margin: 0.15rem 0 0; font-size: 0.85rem; color: var(--text-muted); }
.search-form { display: flex; gap: 0.5rem; }
.search-form input {
  padding: 0.5rem 0.75rem;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  min-width: 230px;
}
.search-form button {
  padding: 0.5rem 0.9rem;
  border: none;
  border-radius: 8px;
  background: var(--accent);
  color: #ffffff;
  font-weight: 600;
  cursor: pointer;
}
.container { max-width: 1040px; margin: 1.5rem auto; padding: 0 1.25rem 3rem; }
.breadcrumbs { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; }
.banner {
  background: var(--badge-bg);
  color: var(--badge-text);
  padding: 0.65rem 1rem;
  border-radius: 10px;
  font-size: 0.88rem;
  margin-bottom: 1.25rem;
}
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.15rem 1.35rem;
  margin-bottom: 0.9rem;
}
.card-title { font-size: 1.1rem; font-weight: 600; margin: 0 0 0.3rem; }
.meta { font-size: 0.85rem; color: var(--text-muted); }
.post-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  margin-bottom: 1.1rem;
  overflow: hidden;
}
.post-header {
  background: var(--surface-alt);
  padding: 0.65rem 1.25rem;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  font-size: 0.88rem;
}
.post-author { font-weight: 700; }
.post-body { padding: 1.25rem; overflow-wrap: break-word; }
.post-body img { max-width: 100%; height: auto; }
.attachments {
  margin-top: 1rem;
  padding-top: 0.75rem;
  border-top: 1px dashed var(--border);
  font-size: 0.88rem;
}
.attachment-gallery {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  margin-top: 0.5rem;
}
.attachment-thumb {
  max-height: 150px;
  max-width: 100%;
  border: 1px solid var(--border);
  border-radius: 6px;
  object-fit: contain;
  background: var(--surface-alt);
}
.attachment-file {
  display: inline-block;
  padding: 0.4rem 0.8rem;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 6px;
  font-weight: 500;
}
.attachment-file:hover {
  background: var(--border);
  text-decoration: none;
}
</style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <h1><a href="index.html" style="color: inherit;">Measurement Forum Archive</a></h1>
        <p>Read-only historical archive of measure.infopop.cc</p>
      </div>
      <form class="search-form" action="search.html" method="get">
        <input type="search" name="q" placeholder="Search threads & posts..." aria-label="Search archive">
        <button type="submit">Search</button>
      </form>
    </div>
  </header>
  <main class="container">
    <div class="banner">Read-Only Historical Archive &mdash; Posting and registration are permanently closed.</div>
    <nav class="breadcrumbs"><a href="index.html">Home</a> &rsaquo; Search</nav>
    
        <h2>Advanced Search</h2>
        <div class="card">
          <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; margin-bottom: 1rem;">
            <div>
              <label style="display:block; margin-bottom:0.3rem; font-size:0.9rem; font-weight:600;">Contains All Of These Words</label>
              <input type="text" id="qAll" class="adv-input" placeholder="e.g. steel tape">
            </div>
            <div>
              <label style="display:block; margin-bottom:0.3rem; font-size:0.9rem; font-weight:600;">Contains At Least One Word</label>
              <input type="text" id="qAny" class="adv-input">
            </div>
            <div>
              <label style="display:block; margin-bottom:0.3rem; font-size:0.9rem; font-weight:600;">Exact Phrase Match</label>
              <input type="text" id="qExact" class="adv-input" placeholder='"calibration course"'>
            </div>
            <div>
              <label style="display:block; margin-bottom:0.3rem; font-size:0.9rem; font-weight:600;">Contains None Of These Words</label>
              <input type="text" id="qNone" class="adv-input" placeholder="exclude these words">
            </div>
            <div>
              <label style="display:block; margin-bottom:0.3rem; font-size:0.9rem; font-weight:600;">Posted By (Author Name)</label>
              <input type="text" id="qAuthor" class="adv-input" placeholder="Display name">
            </div>
            <div>
              <label style="display:block; margin-bottom:0.3rem; font-size:0.9rem; font-weight:600;">Order By</label>
              <select id="sortOrder" class="adv-input">
                <option value="relevance">Relevance</option>
                <option value="newest">Date: Newest First</option>
                <option value="oldest">Date: Oldest First</option>
              </select>
            </div>
          </div>
          
          <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <label style="cursor: pointer; font-size: 0.9rem; color: var(--text-muted);">
              <input type="checkbox" id="chkTitleOnly"> Search topic titles only
            </label>
            <button id="btnSearch" style="padding:0.65rem 2rem; background:var(--accent); color:#fff; border:none; border-radius:6px; cursor:pointer; font-weight:600; font-size:1rem;">Search</button>
          </div>
          <p class="meta" id="searchStatus" style="margin:1rem 0 0; font-weight:500;">Enter search criteria above.</p>
        </div>
        <div id="searchResults"></div>
        <style>
          .adv-input { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-family: inherit; }
          .adv-input:focus { outline: 2px solid var(--accent); border-color: transparent; }
          #btnSearch:hover { background: var(--accent-hover); }
        </style>
        
  </main>
  
        <script src="search_index.js"></script>
        <script>
          (function() {
            const inputs = {
                all: document.getElementById('qAll'),
                any: document.getElementById('qAny'),
                exact: document.getElementById('qExact'),
                none: document.getElementById('qNone'),
                author: document.getElementById('qAuthor'),
                titleOnly: document.getElementById('chkTitleOnly'),
                sort: document.getElementById('sortOrder')
            };
            const btnSearch = document.getElementById('btnSearch');
            const status = document.getElementById('searchStatus');
            const resultsEl = document.getElementById('searchResults');
            const records = window.FORUM_SEARCH_INDEX || [];

            function escapeHtml(str) {
              return String(str).replace(/[&<>"']/g, s => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
              }[s]));
            }

            function runSearch() {
              const valAll = inputs.all.value.toLowerCase().trim();
              const valAny = inputs.any.value.toLowerCase().trim();
              const valExact = inputs.exact.value.toLowerCase().trim();
              const valNone = inputs.none.value.toLowerCase().trim();
              const valAuthor = inputs.author.value.toLowerCase().trim();
              const isTitleOnly = inputs.titleOnly.checked;
              const sortOrder = inputs.sort.value;

              // Do not run if all text fields are completely empty
              if (!valAll && !valAny && !valExact && !valNone && !valAuthor) {
                status.textContent = 'Showing ' + records.length.toLocaleString() + ' indexed posts. Enter search criteria above.';
                resultsEl.innerHTML = '';
                return;
              }
              
              const termsAll = valAll ? valAll.split(/\s+/) : [];
              const termsAny = valAny ? valAny.split(/\s+/) : [];
              const termsNone = valNone ? valNone.split(/\s+/) : [];
              
              let matches = records.filter(item => {
                const hay = isTitleOnly 
                    ? item.title.toLowerCase() 
                    : (item.title + ' ' + item.author + ' ' + item.area + ' ' + item.text).toLowerCase();
                    
                // 1. Contains All
                if (termsAll.length > 0 && !termsAll.every(t => hay.includes(t))) return false;
                
                // 2. Contains Any (at least one)
                if (termsAny.length > 0 && !termsAny.some(t => hay.includes(t))) return false;
                
                // 3. Exact Phrase
                if (valExact && !hay.includes(valExact)) return false;
                
                // 4. Contains None (exclude)
                if (termsNone.length > 0 && termsNone.some(t => hay.includes(t))) return false;
                
                // 5. Posted By
                if (valAuthor && !item.author.toLowerCase().includes(valAuthor)) return false;
                
                return true;
              });

              // Apply Sorting (Defaults to Relevance / Original DB Order)
              if (sortOrder === 'newest') {
                  matches.sort((a, b) => b.sort_key.localeCompare(a.sort_key));
              } else if (sortOrder === 'oldest') {
                  matches.sort((a, b) => a.sort_key.localeCompare(b.sort_key));
              }
              
              status.textContent = 'Found ' + matches.length.toLocaleString() + ' matching post(s).';
              
              // Cap display to first 150 results to prevent browser lag on massive queries
              resultsEl.innerHTML = matches.slice(0, 150).map(m => `
                <div class="card">
                  <div class="card-title"><a href="${escapeHtml(m.url)}">${escapeHtml(m.title)}</a></div>
                  <div class="meta">${escapeHtml(m.area)} &bull; Posted by <strong>${escapeHtml(m.author)}</strong> on ${escapeHtml(m.date)}</div>
                  <p style="margin:0.5rem 0 0; font-size:0.93rem;">${escapeHtml(m.text.slice(0, 260))}${m.text.length > 260 ? '...' : ''}</p>
                </div>
              `).join('');
            }

            // Catch searches originating from the header bar (query parameters)
            const params = new URLSearchParams(window.location.search);
            if (params.get('q')) {
                inputs.all.value = params.get('q');
                runSearch();
            }

            // Event Listeners
            btnSearch.addEventListener('click', runSearch);
            Object.values(inputs).forEach(input => {
                if(input.tagName === 'INPUT' && input.type === 'text') {
                    input.addEventListener('keypress', e => { if(e.key === 'Enter') runSearch(); });
                } else if(input.tagName === 'SELECT' || input.type === 'checkbox') {
                    input.addEventListener('change', runSearch);
                }
            });
          })();
        </script>
        
</body>
</html>
